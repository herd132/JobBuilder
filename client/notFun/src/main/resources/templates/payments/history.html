<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Builder</title>
  <!-- CSS, font awesome 라이브러리-->
  <th:block th:replace="~{common/common}"></th:block>
  <link rel="stylesheet" href="/css/payments/history.css">
  <link rel="stylesheet" href="/css/payments/payments.css">

</head>


<body>

  <!-- header (홈버튼, 홈페이지 이름, 로그인버튼, 네비바, 검색창)-->
  <th:block th:replace="~{common/main-header}"></th:block>



  <!--회색배경영역(제일끝)-->
  <div class="payments-background-gray">

    <!-- 흰색배경영역(안쪽)  -->
    <div class="payments-background-white">

      <!-- 상단 제목 스타일 -->
      <h1 class="payments-title">결제 내역
        <button id="cancelBtn" class="payments-c-btn-after" onclick="history.back()"
        style="cursor:pointer;">돌아가기</button>
        <hr>
      </h1>
      

      <div id="finalResult">

        <div class="resultp" id="resultp">
          
        </div>
      </div>

      <div class="paginationRecruitment-area">
        <ul class="paginationRecruitment" id="pagination">
        </ul>
      </div>


     

    </div>



  </div> <!-- 흰색부분 -->
  </div> <!-- 회색부분 -->


  <!-- footer 우선 갖다가 쓰는겁니다 잊지말고 바꿔야해요 -->
  <th:block th:replace="~{common/main-footer}"></th:block>




  <script src="/js/payments/history.js"></script>
</body>

</html>
