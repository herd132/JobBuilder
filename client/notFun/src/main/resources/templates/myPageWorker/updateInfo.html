<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPage</title>

    <!-- header footer css 입니다 잊지 말고 header footer 사용시 연결해주세요 + 폰트 어썸 사용 -->
    <th:block th:replace="~{common/common}"></th:block>

    <!-- css 연결 -->
    <link rel="stylesheet" href="/css/myPageWorker/updateInfo.css">
</head>

<body>
    <!-- myPageWorker 헤더 -->
    <th:block th:replace="~{common/myPageWorker-header}"></th:block>

    <div class="header">
    <h2 class="title">내 정보 수정</h2>
    </div>
    <main class="container">
        <form action="/myPageWorkee/updateInfo" class="update-form" method="post">
            <div class="profile-image-area">

                <img th:with="user=#{avatar.default.image}" th:src="${session.loginWorker.profileImg ?: user}"
                    id="profileImg" class="profile-img">
                <!-- 기본 이미지 경로 적을 것 -->

                <span id="deleteImage">x</span>
            </div>

            <div class="profile-btn-area">
                <label for="imageInput">프로필 선택</label>
                <input type="file" name="profileImg" id="imageInput" accept="image/*">
            </div>

            <br>
            <div class="form-group">
                <label style="color: red;">* 필수 입력사항입니다</label>
                <label for="workerNickname">닉네임</label>
                <div class="nickname-input-area">
                    <input type="text" name="workerNickname" maxlength="20" id="workerNickname">
                    <button type="button" id="checkNickname" class="info-button">중복확인</button>
                </div>
                <span class="signUp-message" id="nicknameMessage">한글, 영어, 숫자로만 2~20 글자로 입력해주세요.</span>
            </div>

            <br>
            <div class="form-group">
                <label style="color: red;">* 필수 입력사항입니다</label>
                <label for="memberTel">연락처</label>
                <input type="text" name="memberTel" maxlength="11" id="memberTel" placeholder="-를 제외한 숫자를 입력해 주세요">
                <span class="signUp-message" id="memberTelMessage"></span>
            </div>

            <br>
            <div class="form-group">
                <label style="color: red;">* 필수 입력사항입니다</label>
                <label for="memberEmail">이메일</label>
                <div class="email-input-area">
                    <input type="email" id="memberEmail" name="memberEmail">
                    <span class="email-input-message"></span>
                    <button type="button" id="sendAuthKeyBtn" class="btn-secondary">인증번호 받기</button>
                </div>
                <span class="workerEmailMessage" id="workerEmailMessage"></span>
            </div>

            <div class="form-group">
                <label for="authKey">인증번호 입력</label>
                <div class="authkey-input-area">
                  <input type="text" name="authKey" id="authKey" placeholder="인증번호 입력">
                  <button type="button" id="checkAuthKeyBtn" class="btn-secondary2">확인</button>
                </div>
                <span id="authKeyMessage"></span>
            </div>


            <div class="form-group">
                <label for="workerMbti">MBTI</label>
                <input placeholder="대문자 알파벳만 입력 가능합니다" type="text" oninput="handleOnInput(this)" name="workerMbti" id="workerMbti" maxlength="4">
                <span class="workerMbtiMessage" id="workerMbtiMessage"></span>
            </div>

            <div class="form-group address-group">
                <label for="postcode">주소</label>
                <div class="address-inputs">
                    <input type="text" name="workerAddress" id="postcode" placeholder="우편번호">
                    <button type="button" class="search-button">검색</button>
                </div>
                <input type="text" placeholder="도로명 지번 주소" id="address" name="workerAddress" class="full-width">
                <input type="text" placeholder="상세주소" id="detailAddress" name="workerAddress">
            </div>

            <div class="button-group">
                <button type="submit" class="submit-button">등록</button>
                <button type="button" class="cancel-button"
                    onclick="location.href='http://localhost/myPageWorkee/myPageWorkerInfo'";>취소</button>
            </div>
        </form>

    </main>
</body>
<!-- footer 우선 갖다가 쓰는겁니다 잊지말고 바꿔야해요 -->
<th:block th:replace="~{common/main-footer}"></th:block>
<!-- JS연결 -->
<script src="/js/myPageWorker/updateInfo.js"></script>
<!-- 다음 API 연결 -->
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

</html>
