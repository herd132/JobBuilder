<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이력서 관리</title>
    <th:block th:replace="~{common/common}"></th:block>
    <link rel="stylesheet" href="/css/resume/resumeList.css">
    <link rel="stylesheet" href="/css/resume/resume.css">
</head>
<body>
    <th:block th:replace="~{common/myPageWorker-header}"></th:block>

    <div class="resume-background-gray">
        <div class="resume-background-white">
            <h1 class="resume-title">이력서 관리<hr></h1>

            <div class="resume-t-background-outside" id="finalResult">
                <div class="resume-t-background-inside">
                    <div id="resultp">
                        <table class="resume-table">
                            <thead>
                                <tr>
                                    <th>번호</th>
                                    <th>이력서 제목</th>
                                    <th>최종 수정일</th>
                                    <th>경력</th>
                                    <th>공개 여부</th>
                                    <th>맞춤 알바</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="resumeTableBody">
                                <!-- JavaScript로 동적 추가될 내용 -->
                            </tbody>
                        </table>
                    </div>

                    <div class="resume-t-write">
                        <button id="writeBtn" class="resume-t-btn-after">이력서 작성</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{common/main-footer}"></th:block>
    <script src="/js/resume/resumeList.js"></script>
</body>
</html>
