<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <link rel="stylesheet" href="/css/worker/workerSignup.css">
  <th:block th:replace="~{common/common}"></th:block>
</head>

<body>
  <th:block th:replace="~{common/main-header}"></th:block>
  
  <div class="signup-container">
    <div class="signup-title" style="  text-align: start;margin-bottom: 30px;font-size: 80px;">
      <h1>개인 회원가입</h1>
    </div>
    <form action="/" method="post">
      <div class="checkbox-container">
        <label class="checkbox-label">
          <input type="checkbox"> 
          <span style="font-size: 20px;">
            전체 동의하기
          </span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" required> (필수) 서비스 이용약관동의
        </label>
        <label class="checkbox-label">
          <input type="checkbox" required> (필수) 서비스 이용약관동의
        </label>
        <label class="checkbox-label">
          <input type="checkbox" required> (필수) 서비스 이용약관동의
        </label>        
      </div>


      <div class="form-group">
        <label>이메일</label>
        <div style="display: flex; gap: 10px;">
          <input type="email" required>
          <button type="button" class="verification-btn">인증번호 받기</button>
        </div>
      </div>

      <div class="form-group">
        <label>인증번호</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" required>
          <button type="button" class="verification-btn">인증번호 확인</button>
        </div>
      </div>

      <div class="form-group">
        <label> 아이디 </label>
        <div style="display: flex; gap: 10px;">
          <input type="text" required>
          <button type="button" class="verification-btn">아이디 중복확인</button>
        </div>
      </div>

      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" required>
      </div>

      <div class="form-group">
        <label>비밀번호 확인</label>
        <input type="password" required>
      </div>

      <div class="form-group">
        <label>생년월일</label>
        <input type="text" required placeholder="ex ) 19981104">
      </div>

      <div class="form-group">
        <label>MBTI</label>
        <input type="text" required>
      </div>

      <div class="form-group">
        <label>닉네임</label>
        <input type="text" required>
      </div>

      <div class="form-group">
        <label>이름</label>
        <input type="text" required>
      </div>

      <div class="form-group">
        <label>전화번호</label>
        <input type="tel" placeholder="-를 제외하고 11자로 입력해 주세요" required>
      </div>

      <div class="form-group">
        <label for="memberAddress">주소</label>
        <div class="signUp-input-area">
          <div style="display: flex; gap: 10px;">
            <input type="text" name="memberAddress" placeholder="우편번호" maxlength="6" id="postcode">
            <button type="button" id="searchAddress">주소 상세 검색</button>
          </div>
        </div>

        <div class="signUp-input-area">
          <input type="text" name="memberAddress" placeholder="도로명/지번 주소" id="address">
        </div>

        <div class="signUp-input-area">
          <input type="text" name="memberAddress" placeholder="상세 주소" id="detailAddress">
        </div>
      </div>

      <div class="button-group">
        <button type="button" class="btn-cancel">가입취소</button>
        <button type="submit" class="button">가입하기</button>
      </div>
    </form>
  </div>

  <th:block th:replace="~{common/main-footer}"></th:block>

  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="/js/worker/workerSignup.js"></script>
</body>

</html>
