<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/worker/workerLogin.css">
       
</head>
<body>

  <th:block th:replace="~{common/main-header}"></th:block>
    <div class="header">
        <div class="logo"></div>
        <div class="title">취업빌드는 잡빌드!</div>
    </div>

    <div class="login-container">
        <div class="tab-container">
            <button class="tab active">개인회원</button>
            <button class="tab">기업회원</button>
        </div>

        <div class="input-container">
            <input type="text" placeholder="ID를 입력해 주세요">
            <input type="password" placeholder="PW를 입력해 주세요">
        </div>

        <div class="login-options">
            <div class="checkbox-container">
                <input type="checkbox" id="save-id">
                <label for="save-id">아이디저장</label>
            </div>
            <div>계정찾기</div>
        </div>

        <button class="login-button">로그인</button>

        <div class="help-links">
            <a href="#">회원가입</a>
            <a href="#">비밀번호 찾기</a>
        </div>
        
    <button class="chat-button">💬</button>
    </div>

    <th:block th:replace="~{common/main-footer}"></th:block>
</body>
</html>
