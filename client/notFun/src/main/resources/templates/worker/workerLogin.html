<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/worker/workerLogin.css">
    <th:block th:replace="~{common/common}"></th:block>
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"
  integrity="sha384-DKYJZ8NLiK8MN4/C5P2dtSmLQ4KwPaoqAfyA/DfmEc1VDxu4yyC7wy6K1Hs90nka" crossorigin="anonymous"></script>
<script>
  Kakao.init('c089c8172def97eb00c07217cae17495'); // 사용하려는 앱의 JavaScript 키 입력
</script>
       
</head>
<body>

  <th:block th:replace="~{common/main-header}"></th:block>
    <form action="/worker/workerLogin" method="post" id="loginForm">
    <main>
      <div class="header">
          <span class="logo">
            <a href="/"><img src="/images/logo.png" alt="로고" class="logo-img" href="/"></a>
          </span>
          <div class="title">취업빌드는 잡빌드!</div>
      </div>

      <div class="login-container">
          <div class="tab-container">
              <button type="button" class="tab active">개인회원</button>
              <button type="button" class="tab">기업회원</button>
          </div>

          <div class="input-container">
              <input type="text" placeholder="ID를 입력해 주세요" name="workerId">
              <input type="password" placeholder="PW를 입력해 주세요" name="memberPw">
          </div>

          <div class="login-options">
              <div class="checkbox-container">
                  <input type="checkbox" id="save-id">
                  <label for="save-id">아이디저장</label>
              </div>
              <div>계정찾기</div>
          </div>

          <button type="submit" class="login-button">로그인</button>

          <div class="help-links">
              <a href="/multiSignUp">회원가입</a>
              <a href="#">비밀번호 찾기</a>
          </div>
          
          <a id="kakao-login-btn" href="javascript:loginWithKakao()">
            <img src="https://k.kakaocdn.net/14/dn/btroDszwNrM/I6efHub1SN5KCJqLm1Ovx1/o.jpg" width="222"
              alt="카카오 로그인 버튼" />
          </a>
          <p id="token-result"></p>
      </div>
    </main>
  </form>

  <th:block th:replace="~{common/main-footer}"></th:block>
  <script src="/js/worker/workerLogin.js"></script>
  
    
  
</body>
</html>
