<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/worker/workerFindEmail.css">
  <th:block th:replace="~{common/common}"></th:block>
  <title> 근로자 비밀번호 찾기</title>
</head>

<body>
  <main>
    <th:block th:replace="~{common/main-header}"></th:block>
    <h1> 비밀번호 찾기 </h1>
    <th:block>
      <form action="/worker/workerFindPw" method="post" class="workerFindPw-container">
        <div>이름 : <input type="text" name="memberName" class="memberName" required> </div>
        <div>아이디 : <input type="text" name="workerId" class="workerId" required></div>
        <div>연락처 : <input type="tel" name="memberTel" class="memberTel" required> </div>
        <div>이메일 인증하기</div>
        <div class="form-group">
          <label>이메일</label>
          <div style="display: flex; ">
            <input type="email" id="memberEmail" name="memberEmail" required>
            <button type="button" class="verification-btn" id="sendAuthKeyBtn">인증번호 받기</button>
          </div>
          <span class="signUp-message" id="workerEmailMessage" style="font-size: 12px;">
            메일을 받을 수 있는 이메일을 입력해주세요.
          </span>
        </div>

        <div class="form-group">
          <label>인증번호</label>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="authKey" name="authKey" required>
            <button type="button" class="verification-btn" id="checkAuthKeyBtn">인증번호 확인하기</button>
            <span id="authKeyMessage"></span>
          </div>
        </div>

        <button type="submit"> 비밀번호 찾기</button>
      </form>

    </th:block>
    <th:block>

    </th:block>
  </main>

  <th:block th:replace="~{common/main-footer}"></th:block>
  <script src="/js/worker/workerFindPw.js"></script>
</body>

</html>
