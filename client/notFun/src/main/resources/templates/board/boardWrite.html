<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성</title>

    <th:block th:replace="~{common/common}"></th:block>
    
    <link rel="stylesheet" th:href="@{/css/board/boardWrite-style.css}">

    <script src="http://code.jquery.com/jquery-3.5.1.min.js"></script>
    
    <script src="/js/summernote/summernote-lite.js"></script>
    <script src="/js/summernote/lang/summernote-ko-KR.js"></script>
    
    <link rel="stylesheet" href="/css/summernote/summernote-lite.css">
</head>
<body>
    <main>
        <th:block th:replace="~{common/header}"></th:block>

        <!-- 절대 경로 작성법 : <form th:action="@{/editBoard/{boardCode}/insert(boardCode=${boardCode})}"  -->
			<!-- 현재 위치 : /editBoard/1/insert 
				상대 경로 : insert
				목표 경로 : /editBoard/1/insert (POST)
			-->
        <form action="insert"
            method="POST"  class="board-write" id="boardWriteFrm" 
            enctype="multipart/form-data">

            <!-- 제목 -->
            <h1 class="board-title">
                <input type="text" name="boardTitle" placeholder="제목" value="">
            </h1>


            <!-- 내용 -->
            <div class="board-content">
                <textarea name="Summernote" id="Summernote" maxlength="10000" cols="30" rows="5" placeholder="내용을 입력해주세요" class="with-border">
                </textarea>
            </div>


            <!-- 버튼 영역 -->
            <div class="board-btn-area">
                <button class="writebtn" id="cancelBtn">취소</button>
                <button type="submit" class="writebtn">등록</button>
            </div>

            
        </form>

    </main>

    <th:block th:replace="~{common/footer}"></th:block>

    <script src="/js/board/boardWrite.js"></script>





    <!-- 이미지를 섬머노트 에디터 안에 넣는 스크립트-->
    <!-- https://programmer93.tistory.com/50 를 참조해서 조금씩 변경해 보세요 :) -->
    <script>
        $('#Summernote').summernote({
			  // 에디터 크기 설정
	  height: 500,
	  // 에디터 한글 설정
	  lang: 'ko-KR',
	  // 에디터에 커서 이동 (input창의 autofocus라고 생각하시면 됩니다.)
	  toolbar: [
             // 폰트 설정
            ['fontname', ['fontname']],
		    // 글자 크기 설정
		    ['fontsize', ['fontsize']],
             // 줄간격 설정
		    ['height', ['height']],
		    // 글자 [굵게, 기울임, 밑줄, 취소 선, 지우기]
		    ['style', ['bold', 'italic', 'underline','strikethrough', 'clear']],
		    // 글자색 설정
		    ['color', ['forecolor','color']],
		    // 서식 [글머리 기호, 번호매기기, 문단정렬]
		    ['para', ['ul', 'ol', 'paragraph']],
            // 에디터 크기 조절 [풀스크린,도움창]
            //['view', ['undo', 'redo']],
		    // 이미지 첨부
		    ['insert',['link','picture']]
		  ],
		  // 추가한 글꼴
		fontNames: ['Arial', 'Arial Black', 'Comic Sans MS', 'Courier New','맑은 고딕','궁서','굴림체','굴림','돋음체','바탕체'],
		 // 추가한 폰트사이즈
		fontSizes: ['8','9','10','11','12','14','16','18','20','22','24','28','30','36','50','72','96'],
        // focus는 작성 페이지 접속시 에디터에 커서를 위치하도록 하려면 설정해주세요.
		focus : true,
        // callbacks은 이미지 업로드 처리입니다.
		callbacks : {                                                    
			onImageUpload : function(files, editor, welEditable) {   
                // 다중 이미지 처리를 위해 for문을 사용했습니다.
				for (var i = 0; i < files.length; i++) {
					imageUploader(files[i], this);
				}
			},
                 onMediaDelete: function ($target, editor, $editable) {
                 if (confirm('이미지를 삭제 하시겠습니까? 삭제후엔 되돌릴 수 없습니다!')) {
                    var deletedImageUrl = $target
                            .attr('src')
                            .split('/')
                            .pop()

                     // ajax 함수 호출
                        deleteSummernoteImageFile(deletedImageUrl)
                }
                else{
                    var imgUrl = $target.attr('src');
                    $('#Summernote').summernote('insertImage', imgUrl); // Summernote 인스턴스를 통해 이미지 복원
                }
	    	}
        }   
      
		});
    </script>



    <!-- 섬머노트 에디터의 내용을 제출전에 form에 싣기 -->
    <script>
        $(document).ready(function() {
            // // Summernote 초기화
            // $('#Summernote').summernote({
            //     height: 200,   // 기본 높이 설정
            //     placeholder: '내용을 입력해주세요',
            //     tabsize: 2
            // });

            // 폼 전송 전에 Summernote 내용을 textarea에 업데이트
            $('#boardWriteFrm').submit(function(event) {
                var content = $('#Summernote').summernote('code');  // summernote 내용 가져오기
                $('#Summernote').val(content);  // 가져온 내용을 textarea에 넣기
            });
        });
    </script>


</body>
</html>
