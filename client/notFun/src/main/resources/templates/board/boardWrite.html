<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성</title>

    <th:block th:replace="~{common/common}"></th:block>

    <link rel="stylesheet" th:href="@{/css/board/boardWrite-style.css}">
</head>

<body>
    <main>
        <th:block th:replace="~{common/main-header}"></th:block>

        <form action="insert" method="POST" class="board-write" id="boardWriteFrm" enctype="multipart/form-data">

            <!-- 제목 -->
            <h1 class="board-title">
                <input type="text" name="boardTitle" placeholder="제목" value="">
            </h1>


            <!-- 내용 -->
            <div class="board-content">
                <textarea name="Summernote" id="Summernote" maxlength="10000" cols="30" rows="5"
                    placeholder="내용을 입력해주세요" class="with-border">
                </textarea>
            </div>


            <!-- 버튼 영역 -->
            <div class="board-btn-area">
                <button class="writebtn" id="cancelBtn">취소</button>
                <button type="submit" class="writebtn">등록</button>
            </div>


        </form>

    </main>

    <th:block th:replace="~{common/main-footer}"></th:block>
</body>

</html>
