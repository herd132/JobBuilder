<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/board/oneTalkMain.css">
</head>

<body>

    <th:block th:replace="~{common/main-header}"></th:block>


    <h1> 한줄톡톡 </h1>

    <th:block th:if="${session.loginWorker != null} or ${session.loginEmployer != null}">
    </th:block>
    <!-- 내용 -->
    <th:block th:object="${oneTalkList}">
        <div class="board-content">
            <textarea id="oneTalkContent" name="oneTalkContent"></textarea>
            <button id="addoneTalk">글쓰기</button>
        </div>
    </th:block>

    <section class="board-list">

        <th:block th:replace="~{board/oneTalk}"></th:block>

        <!-- ============================================================================================================== -->

        <th:block th:unless="${#lists.isEmpty(oneTalkList)}">

            <!-- 게시글이 있을 때만 페이지네이션이 보이게 할 예정 -->
            <div class="pagination-area">

                <!-- 일반 목록 조회 (검색 X )-->
                <ul class="pagination" th:unless="${param.key}" th:object="${pagination}">


                    <li class="arrow-item"><a th:href="@{/oneTalk/main(cp=1)}" class="arrow-icon">&#8249;&#8249;</a>
                    </li>

                    <!-- 이전 목록 마지막 번호로 이동 -->
                    <li class="arrow-item"><a th:href="@{/oneTalk/main(cp=*{prevPage})}" class="arrow-icon">&#8249;</a>
                    </li>

                    <!-- 특정 페이지로 이동	 startPage 부터 endPage까지 번호생성기	-->

                    <th:block th:each="i : *{#numbers.sequence(startPage, endPage)}">

                        <!-- 현재 보고있는 페이지 -->
                        <li th:if="${i} == *{currentPage}">
                            <a class="current" th:text="${i}">현재페이지</a>
                        </li>

                        <!-- 보고있지 않은 페이지 -->
                        <li th:unless="${i} == *{currentPage}">
                            <a th:href="@{/oneTalk/main(cp=${i})}" th:text="${i}">이동할
                                페이지</a>
                        </li>
                    </th:block>

                    <!-- 다음 목록 시작 번호로 이동 -->
                    <li class="arrow-item"><a th:href="@{/oneTalk/main(cp=*{nextPage})}" class="arrow-icon">&#8250;</a>
                    </li>

                    <!-- 끝 페이지로 이동 -->
                    <li class="arrow-item"><a th:href="@{/oneTalk/main(cp=*{maxPage})}"
                            class="arrow-icon">&#8250;&#8250;</a>
                    </li>
                </ul>

            </div>
        </th:block>


    </section>
    </main>

    <th:block th:replace="~{common/main-footer}"></th:block>

    <script src="/js/board/oneTalk.js"></script>
    <script th:inline="javascript">
        const loginWorkerNo = /*[[${session.loginWorker?.memberNo}]]*/ "로그인 근로자 번호";
        const loginEmployerNo = /*[[${session.loginEmployer?.memberNo}]]*/ "로그인 사업주 번호"
    </script>
</body>

</html>
