<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <th:block th:replace="~{common/main-header}"></th:block>


    <th:block th:if="${session.loginWorker != null} or ${session.loginEmployer != null}">
        <!-- 내용 -->
        <div class="board-content">
            <textarea name="onetalkContent"></textarea>
        </div>

        <div class="btn-area">
            <button id="insertBtn" th:if="${session.loginWorker} or ${session.loginEmployer}">글쓰기</button>
        </div>
    </th:block>

    <section class="board-list">


        <div class="list-wrapper">
            <table class="list-table">

                <tbody>
                    <th:block th:if="${#lists.isEmpty(onetalkList)}">
                        <tr>
                            <th colspan="6">게시글이 존재하지 않습니다.</th>
                        </tr>
                    </th:block>

                    <!-- 게시글이 존재할 때 -->
                    <th:block th:unless="${#lists.isEmpty(onetalkList)}">
                        <!-- iterStat : Varstatus 같은 역할 반복변수-->
                        <tr th:each="onetalk, iterStat : ${onetalkList}" th:object="${onetalk}">
                            <td th:text="*{onetalkNo}">톡톡 번호호</td>
                            <td>
                               
                                
                            </td>
                            <th:block th:if="${onetalk?.workerNickname == null}">
                                <td class="board-writer" th:text="*{businessName}">작성자 닉네임</td>
                            </th:block>
                            <th:block th:if="${onetalk?.workerNickname != null}">
                                <td class="board-writer" th:text="*{workerNickname}">작성자 닉네임</td>
                            </th:block>
                            <!-- 작성일 -->
                            <td th:text="*{onetalkWriteDate}">2023-10-26</td>

                        </tr>


                    </th:block>

                </tbody>
            </table>
        </div>







        <!-- ============================================================================================================== -->

        <th:block th:unless="${#lists.isEmpty(onetalkList)}">

            <!-- 게시글이 있을 때만 페이지네이션이 보이게 할 예정 -->
            <div class="pagination-area">

                <!-- 일반 목록 조회 (검색 X )-->
                <ul class="pagination" th:unless="${param.key}" th:object="${pagination}">


                    <li class="arrow-item"><a th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=1)}"
                            class="arrow-icon">&#8249;&#8249;</a></li>

                    <!-- 이전 목록 마지막 번호로 이동 -->
                    <li class="arrow-item"><a th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=*{prevPage})}"
                            class="arrow-icon">&#8249;</a></li>

                    <!-- 특정 페이지로 이동	 startPage 부터 endPage까지 번호생성기	-->

                    <th:block th:each="i : *{#numbers.sequence(startPage, endPage)}">

                        <!-- 현재 보고있는 페이지 -->
                        <li th:if="${i} == *{currentPage}">
                            <a class="current" th:text="${i}">현재페이지</a>
                        </li>

                        <!-- 보고있지 않은 페이지 -->
                        <li th:unless="${i} == *{currentPage}">
                            <a th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=${i})}" th:text="${i}">이동할
                                페이지</a>
                        </li>
                    </th:block>

                    <!-- 다음 목록 시작 번호로 이동 -->
                    <li class="arrow-item"><a th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=*{nextPage})}"
                            class="arrow-icon">&#8250;</a></li>

                    <!-- 끝 페이지로 이동 -->
                    <li class="arrow-item"><a th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=*{maxPage})}"
                            class="arrow-icon">&#8250;&#8250;</a></li>
                </ul>


                <!-- 검색인 경우 -->
                <ul class="pagination" th:if="${param.key}" th:object="${pagination}">

                    <!-- 첫 페이지로 이동 -->
                    <li class="arrow-item"><a
                            th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=1, key=${param.key}, query=${param.query})}"
                            class="arrow-icon">&#8249;&#8249;</a>
                    </li>

                    <!-- 이전 목록 마지막 번호로 이동 -->
                    <li class="arrow-item"><a
                            th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=*{prevPage}, key=${param.key}, query=${param.query})}"
                            class="arrow-icon">&#8249;</a>
                    </li>

                    <!-- 특정 페이지로 이동 -->
                    <th:block th:if="*{startPage lt endPage}" th:each="i : *{#numbers.sequence(startPage, endPage)}">

                        <!-- 현재 보고있는 페이지 -->
                        <li th:if="${i} == *{currentPage}">
                            <a class="current" th:text="${i}">현재페이지</a>
                        </li>

                        <!-- 보고있지 않은 페이지 -->
                        <li th:unless="${i} == *{currentPage}">
                            <a th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=${i}, key=${param.key}, query=${param.query})}"
                                th:text="${i}">이동할 페이지</a>
                        </li>
                    </th:block>

                    <!-- 일치하는 게시글이 없을 경우 -->
                    <th:block th:unless="*{startPage lt endPage}">
                        <li>
                            <a class="current">1</a>
                        </li>
                    </th:block>

                    <!-- 다음 목록 시작 번호로 이동 -->
                    <li class="arrow-item"><a
                            th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=*{nextPage}, key=${param.key}, query=${param.query})}"
                            class="arrow-icon">&#8250;</a>
                    </li>

                    <!-- 끝 페이지로 이동 -->
                    <li class="arrow-item"><a
                            th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=*{maxPage}, key=${param.key}, query=${param.query})}"
                            class="arrow-icon">&#8250;&#8250;</a>
                    </li>
                </ul>
            </div>
        </th:block>



        <!-- 검색창 -->
        <!-- 현재 : /board/1 
				목표 : /board/1?key=w&query=짱구
			-->
        <form th:action="@{{boardCode}(boardCode=${boardCode})}" method="get" id="boardSearch">

            <select name="key" id="searchKey">
                <option value="t">제목</option>
                <option value="w">작성자</option>
            </select>

            <input type="text" name="query" id="searchQuery" placeholder="검색어를 입력해주세요.">

            <button>검색</button>
        </form>

    </section>
    </main>
    <th:block th:replace="~{board/onetalk}"></th:block>
    <th:block th:replace="~{common/main-footer}"></th:block>
    <script href="/js/board/onetalk.js"></script>

</body>

</html>
