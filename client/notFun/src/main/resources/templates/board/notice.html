<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Builder-공지사항</title>

    <!-- header footer css 입니다 잊지 말고 header footer 사용시 연결해주세요 + 폰트 어썸 사용 -->
    <th:block th:replace="~{common/common}"></th:block>

    <!-- <main> 안쪽 CSS -->
    <link rel="stylesheet" href="/css//board/notice.css">
</head>

<body>
    <!-- 로고 및 검색바 로그인 -->
    <th:block th:replace="~{common/main-header}"></th:block>
    <!-- 주의사항 디자인을 위해 th문 안 넣었습니다 th문은 알아서!!!! -->
    <main>
        <!-- Main board container -->
        <div class="board-container">
            <!-- Board title -->
            <div class="board-header">
                <h2 class="board-title">공지사항</h2>
                <button class="write-btn">글쓰기</button>
            </div>

            <!-- Board list -->
            <div class="board-list">
                <!-- Notice item -->
                <div class="post-item">
                    <div class="post-content">
                        <div class="post-title">
                            <a href="#">[공지] 2024년 1분기 정기 시스템 점검 안내</a>
                        </div>
                        <div class="post-info">
                            <span class="date">2024.03.15</span>
                            <span class="views">조회수 40,000,000</span>
                        </div>
                    </div>
                </div>

                <!-- Second notice example -->
                <div class="post-item">
                    <div class="post-content">
                        <div class="post-title">
                            <a href="#">[안내] 홈페이지 이용 가이드라인 업데이트</a>
                        </div>
                        <div class="post-info">
                            <span class="date">2024.03.10</span>
                            <span class="views">조회수 156</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Search section -->
            <div class="search-section">
                <div class="search-container">
                    <select class="search-type">
                        <option value="title">제목</option>
                        <option value="content">내용</option>
                        <option value="title_content">제목+내용</option>
                    </select>
                    <div class="search-input-wrapper">
                        <input type="text" class="search-input" placeholder="검색어를 입력해주세요">
                        <button class="search-button">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M19 19L13 13M15 8C15 11.866 11.866 15 8 15C4.13401 15 1 11.866 1 8C1 4.13401 4.13401 1 8 1C11.866 1 15 4.13401 15 8Z"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <a href="#" class="page-btn">&lt;&lt;</a>
                <a href="#" class="page-btn">&lt;</a>
                <a href="#" class="page-btn active">1</a>
                <a href="#" class="page-btn">2</a>
                <a href="#" class="page-btn">3</a>
                <a href="#" class="page-btn">4</a>
                <a href="#" class="page-btn">5</a>
                <a href="#" class="page-btn">6</a>
                <a href="#" class="page-btn">7</a>
                <a href="#" class="page-btn">8</a>
                <a href="#" class="page-btn">9</a>
                <a href="#" class="page-btn">10</a>
                <a href="#" class="page-btn">&gt;</a>
                <a href="#" class="page-btn">&gt;&gt;</a>
            </div>
        </div>

    </main>

    <a href="#">임시용 글쓰기 링크</a>

    <!-- footer 우선 갖다가 쓰는겁니다 잊지말고 바꿔야해요 -->
    <th:block th:replace="~{common/main-footer}"></th:block>
</body>

</html>
