<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>게시판 이름</title>

	<th:block th:replace="~{common/common}"></th:block>
	<link rel="stylesheet" href="/css/board/boardList.css">

</head>

<body>
	<main>

		<th:block th:replace="~{common/main-header}"></th:block>



		<section class="board-list">

			<th:block th:each="boardType : ${application.boardTypeList}">
				<h1 class="board-name" th:if="${boardType.boardCode} == ${boardCode}" th:text="${boardType.boardName}">게시판 이름
				</h1>
			</th:block>
			<div class="list-wrapper">
				<table class="list-table">

					<thead>
						<tr>
							<th>글번호</th>
							<th>제목</th>
							<th>작성자</th>
							<th>작성일</th>
							<th>조회수</th>							
						</tr>
					</thead>

					<tbody>
						<!-- 게시글이 존재하지 않을 때 -->

						<!-- 여러행 조회 시 결과가 없을 경우 == List 가 비어있음 -->

						<!-- #lists : 타임리프에서 list 관련 기능을 제공하는 객체 -->
						<!-- ${#lists.size(boardList) == 0} -->
						<th:block th:if="${#lists.isEmpty(boardList)}">
							<tr>
								<th colspan="6">게시글이 존재하지 않습니다.</th>
							</tr>
						</th:block>

						<!-- 게시글이 존재할 때 -->
						<th:block th:unless="${#lists.isEmpty(boardList)}">
							<!-- iterStat : Varstatus 같은 역할 반복변수-->
							<tr th:each="board, iterStat : ${boardList}" th:object="${board}">
								<td th:text="*{boardNo}">게시글 번호</td>

								<td>
									<!-- 썸네일 추가 예정 -->

									<!-- 상세 조회 주소에 cp가 포함된 이유 : 상세 -> 목록으로 돌아올 때 사용 -->


									<!-- 검색 X ( 전체가 보여지고있는상태 )  자리마련안되어있는 CP는 쿼리스트링에 들어감-->
									<a th:unless="${param.key}"
										th:href="@{/board/{boardCode}/{boardNo} (boardCode=${boardCode}, boardNo=*{boardNo}, cp=${pagination.currentPage})}"
										th:text="*{boardTitle}" class="text-title">게시글 제목</a>

									<!-- 검색 O -->
									<a th:if="${param.key}"
										th:href="@{/board/{boardCode}/{boardNo} (boardCode=${boardCode}, boardNo=*{boardNo}, cp=${pagination.currentPage}, key=${param.key}, query=${param.query})}"
										th:text="*{boardTitle}" class="text-title">게시글 제목</a>

									<th:block th:text="|[*{commentCount}]|">댓글 수</th:block>
								</td>

								<!-- 작성자 닉네임 -->
								<td th:text="*{memberName}">닉네임</td>

								<!-- 작성일 -->
								<td th:text="*{boardWriteDate}">2023-10-26</td>

								<!-- 조회수 -->
								<td th:text="*{boardReadCount}">0</td>				

							</tr>
						</th:block>

					</tbody>
				</table>
			</div>

			<th:block th:if="${session.loginWorker != null} or ${session.loginEmployer != null}">
				<!-- <th:block th:if="${session.loginMember.authorityNo == 3} and ${boardCode == 1}"> -->
					<!-- 관리자만 공지게시판에 글 작성 가능-->
					<!-- <div class="btn-area"> -->
						<!-- <button id="insertBtn" th:if="${session.loginManager}">글쓰기 ( 관리자 전용 )</button> -->
					<!-- </div> -->
				<!-- </th:block> -->
				<th:block th:if="${boardCode != 1}">
					<div class="btn-area">
						<!-- 로그인 상태일 때만 글쓰기 버튼 노출 -->
						<button id="insertBtn" th:if="${session.loginWorker} or ${session.loginEmployer}">글쓰기</button>
					</div>
				</th:block>
			</th:block>






			<!-- ============================================================================================================== -->
			
			<th:block th:unless="${#lists.isEmpty(boardList)}"> 

				<!-- 게시글이 있을 때만 페이지네이션이 보이게 할 예정 -->
				<div class="pagination-area">
	
					<!-- 일반 목록 조회 (검색 X )-->
					<ul class="pagination" th:unless="${param.key}" th:object="${pagination}">
	
	
						<li class="arrow-item"><a th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=1)}"
								class="arrow-icon">&#8249;&#8249;</a></li>
	
						<!-- 이전 목록 마지막 번호로 이동 -->
						<li class="arrow-item"><a th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=*{prevPage})}"
								class="arrow-icon">&#8249;</a></li>
	
						<!-- 특정 페이지로 이동	 startPage 부터 endPage까지 번호생성기	-->
	
						<th:block th:each="i : *{#numbers.sequence(startPage, endPage)}">
	
							<!-- 현재 보고있는 페이지 -->
							<li th:if="${i} == *{currentPage}">
								<a class="current" th:text="${i}">현재페이지</a>
							</li>
	
							<!-- 보고있지 않은 페이지 -->
							<li th:unless="${i} == *{currentPage}">
								<a th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=${i})}" th:text="${i}">이동할 페이지</a>
							</li>
						</th:block>
	
						<!-- 다음 목록 시작 번호로 이동 -->
						<li class="arrow-item"><a th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=*{nextPage})}"
								class="arrow-icon">&#8250;</a></li>
	
						<!-- 끝 페이지로 이동 -->
						<li class="arrow-item"><a th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=*{maxPage})}"
								class="arrow-icon">&#8250;&#8250;</a></li>
					</ul>
	
	
					<!-- 검색인 경우 -->
					<ul class="pagination" th:if="${param.key}" th:object="${pagination}">
	
						<!-- 첫 페이지로 이동 -->
						<li class="arrow-item"><a
								th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=1, key=${param.key}, query=${param.query})}"
								class="arrow-icon">&#8249;&#8249;</a>
						</li>
	
						<!-- 이전 목록 마지막 번호로 이동 -->
						<li class="arrow-item"><a
								th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=*{prevPage}, key=${param.key}, query=${param.query})}"
								class="arrow-icon">&#8249;</a>
						</li>
	
						<!-- 특정 페이지로 이동 -->
						<th:block th:if="*{startPage lt endPage}" th:each="i : *{#numbers.sequence(startPage, endPage)}">
	
							<!-- 현재 보고있는 페이지 -->
							<li th:if="${i} == *{currentPage}">
								<a class="current" th:text="${i}">현재페이지</a>
							</li>
	
							<!-- 보고있지 않은 페이지 -->
							<li th:unless="${i} == *{currentPage}">
								<a th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=${i}, key=${param.key}, query=${param.query})}"
									th:text="${i}">이동할 페이지</a>
							</li>
						</th:block>
	
						<!-- 일치하는 게시글이 없을 경우 -->
						<th:block th:unless="*{startPage lt endPage}">
							<li>
								<a class="current">1</a>
							</li>
						</th:block>
	
						<!-- 다음 목록 시작 번호로 이동 -->
						<li class="arrow-item"><a
								th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=*{nextPage}, key=${param.key}, query=${param.query})}"
								class="arrow-icon">&#8250;</a>
						</li>
	
						<!-- 끝 페이지로 이동 -->
						<li class="arrow-item"><a
								th:href="@{/board/{boardCode}(boardCode=${boardCode}, cp=*{maxPage}, key=${param.key}, query=${param.query})}"
								class="arrow-icon">&#8250;&#8250;</a>
						</li>
					</ul>
				</div>
			</th:block>



			<!-- 검색창 -->
			<!-- 현재 : /board/1 
				목표 : /board/1?key=w&query=짱구
			-->
			<form th:action="@{{boardCode}(boardCode=${boardCode})}" method="get" id="boardSearch">

				<select name="key" id="searchKey">
					<option value="t">제목</option>
					<option value="w">작성자</option>
				</select>

				<input type="text" name="query" id="searchQuery" placeholder="검색어를 입력해주세요.">

				<button>검색</button>
			</form>

		</section>
	</main>


	<th:block th:replace="~{common/main-footer}"></th:block>

	<script th:inline="javascript">
		const boardCode = "게시판 코드 번호";

	</script>

	<script src="/js/board/boardList.js"></script>

</body>

</html>
