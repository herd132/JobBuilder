<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Builder</title>

  <link rel="stylesheet" href="/css/myPageEmployer/myPageEmpHeader.css">
  <link rel="stylesheet" href="/css/myPageEmployer/myPageEmpFooter.css">
  <link rel="stylesheet" href="/css/myPageEmployer/myPageEmpRecruitmentList.css">
  
  <!--  12월 27일 오전 9시 36분 횟수 51회 -->
  <script src="https://kit.fontawesome.com/a0e57c9b1e.js" crossorigin="anonymous"></script>

  <!-- https://github.com/sockjs/sockjs-client -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
</head>

<body>
  <!-- 로고 및 검색바 로그인 -->
  <th:block th:replace="~{common/myPageEmployer-header}"></th:block>

  <div class="recruitmentList-gray">
    <main class="myPageEmpInfo-white">
      <div class="btn-container">
        <button onclick="addRecruitment()">공고 추가하기</button>
      </div>

      <div class="list-wrapper">
        <table class="list-table">

          <thead>
            <tr>
              <th>공고 번호</th>
              <th>공고 제목</th>
              <th>지점명</th>
              <th>작성일</th>
              <th>마감일</th>
              <th>구인완료여부</th>
            </tr>
          </thead>

          <tbody>
            <th:block th:if="${#lists.isEmpty(recruitmentList)}">
              <tr>
                <th colspan="5">작성한 공고글이 없습니다</th>
              </tr>
            </th:block>

            <th:block th:unless="${#lists.isEmpty(recruitmentList)}">
              <tr th:each="recruitment, iterStat : ${recruitmentList}" th:object="${recruitment}">
                <td th:text="${iterStat.count}"></td>
                <td>
                  <!-- 검색 안한 경우-->
                  <a th:unless="${param.key}" th:text="*{recruitmentTitle}"
                    th:href="@{/recruitment/detail/{recruitmentNo} (recruitmentNo=*{recruitmentNo}, cp=${paginationRecruitment.currentPage}, stat=myPageEmp)}"
                  />

                  <!-- 검색 한 경우-->
                  <a th:if="${param.key}" th:text="*{recruitmentTitle}"
                  th:href="@{/recruitment/detail/{recruitmentNo} (recruitmentNo=*{recruitmentNo}, cp=${paginationRecruitment.currentPage}, key=${param.key}, query=${param.query}, stat=myPageEmp)}"
                  />
                </td>
                <td th:text="*{businessNickname}"></td>
                <td th:text="*{writeDate}"></td>
                <td th:text="*{recruitmentDeadline}"></td>
                <td>
                  
                  <span th:text="*{recruitCompleteFl}" th:id="|completeFl*{recruitmentNo}|"></span>
                  <button class="change-recruit-complete" th:recruitmentNo="*{recruitmentNo}"
                    th:onclick="changeRecruitComplete(this.getAttribute('recruitmentNo'))">
                    변경
                  </button>
                </td>
              </tr>
            </th:block>
          </tbody>

        </table>
      </div>

      <div class="paginationRecruitment-area">
        
        <!-- 검색 안한 경우-->
				<ul class="pagination" th:unless="${param.key}" th:object="${paginationRecruitment}" >

					<li><a th:href="@{/myPageEmp/recruitmentList(cp=1)}">&lt;&lt;</a></li>
					<li><a th:href="@{/myPageEmp/recruitmentList(cp=*{prevPage})}">&lt;</a></li>

					<!-- 특정 페이지로 이동 -->
					<th:block th:each="i : *{#numbers.sequence(startPage, endPage)}">
						
						<!-- 현재 보고있는 페이지 -->
						<li th:if="${i} == *{currentPage}">
							<a class="current" th:text="${i}">현재페이지</a>
						</li>
						
						<!-- 보고있지 않은 페이지 -->
						<li th:unless="${i} == *{currentPage}">
							<a th:href="@{/myPageEmp/recruitmentList (cp=${i})}" 
								th:text="${i}">이동할 페이지</a>
						</li>
					</th:block>
						
					<!-- 다음 목록 시작 번호로 이동 -->
					<li><a th:href="@{/myPageEmp/recruitmentList(cp=*{nextPage})}">&gt;</a></li>

					<!-- 끝 페이지로 이동 -->
					<li><a th:href="@{/myPageEmp/recruitmentList(cp=*{maxPage})}">&gt;&gt;</a></li>
				</ul>

        <!-- 검색 한 경우-->
				<ul class="pagination" th:if="${param.key}" th:object="${paginationRecruitment}" >

					<li><a th:href="@{/myPageEmp/recruitmentList(cp=1, key=${param.key}, query=${param.query})}">&lt;&lt;</a></li>
					<li><a th:href="@{/myPageEmp/recruitmentList(cp=*{prevPage}, key=${param.key}, query=${param.query})}">&lt;</a></li>

					<!-- 특정 페이지로 이동 -->
					<th:block th:if="*{startPage lt endPage}" th:each="i : *{#numbers.sequence(startPage, endPage)}">
						
						<!-- 현재 보고있는 페이지 -->
						<li th:if="${i} == *{currentPage}">
							<a class="current" th:text="${i}">현재페이지</a>
						</li>
						
						<!-- 보고있지 않은 페이지 -->
						<li th:unless="${i} == *{currentPage}">
							<a th:href="@{/myPageEmp/recruitmentList (cp=${i}, key=${param.key}, query=${param.query})}" 
								th:text="${i}">이동할 페이지</a>
						</li>
					</th:block>

          <!-- 일치하는 공고가 없을 경우-->
          <th:block th:unless="*{startPage lt endPage}">
						<li>
							<a class="current">1</a>
						</li>
					</th:block>
					
					<!-- 다음 목록 시작 번호로 이동 -->
					<li><a th:href="@{/myPageEmp/recruitmentList(cp=*{nextPage}, key=${param.key}, query=${param.query})}">&gt;</a></li>

					<!-- 끝 페이지로 이동 -->
					<li><a th:href="@{/myPageEmp/recruitmentList(cp=*{maxPage}, key=${param.key}, query=${param.query})}">&gt;&gt;</a></li>
				</ul>
      </div>

      <form th:action="@{/myPageEmp/recruitmentList}" method="get" id="recruitmentSearch">
        <select name="key" id="searchKey">
          <option value="t">제목</option>
          <option value="n">지점</option>
          <option value="tn">제목 + 지점</option>
        </select>

        <input type="text" name="query" id="searchQuery" maxlength="20" placeholder="검색어를 입력하세요">

        <button>검색</button>
      </form>
    </main>
  </div>





  <th:block th:replace="~{common/main-footer}"></th:block>
  <script src="/js/myPageEmployer/myPageEmpHeader.js"></script>
  <script src="/js/myPageEmployer/myPageEmpRecruitmentList.js"></script>
</body>

</html>
