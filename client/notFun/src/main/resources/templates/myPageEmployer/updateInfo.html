<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 정보 수정</title>

  <link rel="stylesheet" href="/css/myPageEmployer/myPageEmpHeader.css">
  <link rel="stylesheet" href="/css/myPageEmployer/myPageEmpFooter.css">
  <link rel="stylesheet" href="/css/myPageEmployer/updateInfo.css">
  
  <!--  12월 27일 오전 9시 36분 횟수 51회 -->
  <script src="https://kit.fontawesome.com/a0e57c9b1e.js" crossorigin="anonymous"></script>

  <!-- https://github.com/sockjs/sockjs-client -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
</head>

<body>
  <!-- 로고 및 검색바 로그인 -->
  <th:block th:replace="~{common/myPageEmployer-header}"></th:block>

  <div class="updateInfo-gray">
    <main class="updateInfo-white">
      <h3>내 정보수정 페이지 입니다.</h3>
      
      <p>
        사업자 등록번호 : &nbsp;<!-- 변경 불가 -->
        <span th:text="${session.loginEmployer.businessRegistrationNumber}"/>
      </p>
    
      <p>
        이메일 : &nbsp;
        <span th:text="${session.loginEmployer.memberEmail}" id="memberEmail"/>
      </p>

      <p>
        대표자명 : &nbsp;
        <span th:text="${session.loginEmployer.memberName}" id="memberName"/>
        <button id="changeMemberNameBtn">변경하기</button>
      </p>

      <p>
        대표자 연락처 : &nbsp;
        <span th:text="${session.loginEmployer.memberTel}" id="memberTel"/>
        <button id="changeMemberTelBtn">변경하기</button>
      </p>

      <p>
        선택약관 동의여부 : &nbsp;
        <span th:text="${session.loginEmployer.optionalAgreeFl}" id="optionalAgreeFl"/>
        <button id="changeOptionalAgreeFlBtn">변경하기</button>
      </p>

      <p>
        <button id="backInfoBtn" onclick="location.href='/myPageEmp/info'">돌아가기</button>
      </p>

    </main>
  </div>

  <th:block th:replace="~{common/main-footer}"></th:block>

  <script th:inline="javascript">
    const memberNo = /*[[${session.loginEmployer.memberNo}]]*/0;
  </script>

  <script src="/js/myPageEmployer/myPageEmpHeader.js"></script>
  <script src="/js/myPageEmployer/updateInfo.js"></script>
</body>

</html>
