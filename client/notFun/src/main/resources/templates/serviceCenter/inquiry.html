<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Builder</title>

    <!-- header footer css 입니다 잊지 말고 header footer 사용시 연결해주세요 + 폰트 어썸 사용 -->
    <th:block th:replace="~{common/common}"></th:block>

    <!-- <main> 안쪽 CSS -->
    <link rel="stylesheet" href="/css//serviceCenter/inquiry.css">
</head>

<body>
    <!-- 로고 및 검색바 로그인 -->
    <th:block th:replace="~{common/main-header}"></th:block>

    <!-- 주의사항 디자인을 위해 th문 안 넣었습니다 th문은 알아서!!!! -->
    <main>
        <div class="container">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('write')">문의 작성</button>
                <button class="tab" onclick="switchTab('list')">내 문의 내역</button>
            </div>

            <div id="writeTab" class="inquiry-form active">
                <form class="inquiry-form">
                    <div class="form-header">
                        <h1>1:1 문의하기</h1>
                        <p>궁금하신 점을 작성해 주세요.</p>
                    </div>

                    <div class="form-group">
                        <label for="title" class="required">제목</label>
                        <input type="text" id="title" name="title" placeholder="문의 제목을 입력해주세요(공백 포함 최대 25글자)" required oninput="updateTitle(this)">
                    </div>

                    <div class="form-group">
                        <label class="required">문의 유형</label>
                        <div class="category-section">
                            <div class="category-select">
                                <select id="mainCategory" name="mainCategory" required onchange="updateSubCategory()">
                                    <option value="">대분류 선택</option>
                                    <option value="1">회원정보</option>
                                    <option value="2">구직활동</option>
                                    <option value="3">공고관련</option>
                                    <option value="4">결제</option>
                                    <option value="5">신고</option>
                                    <option value="6">기타</option>
                                </select>
                            </div>
                            <div class="category-select">
                                <select id="subCategory" name="subCategory" required disabled>
                                    <option value="">소분류 선택</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="content-container">
                            <textarea id="content" name="content" placeholder="문의하실 내용을 자세히 작성해주세요 (최대 2000자)" required
                            oninput="updateCharCount(this)" maxlength="2000"></textarea>
                            <div class="char-counter">0 / 2000자</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email" class="required">이메일</label>
                        <th:block th:if="${session.loginWorker != null}">
                            <input type="email" id="email" name="email"
                            placeholder="답변 받으실 이메일을 입력해주세요" th:value="${session.loginWorker.memberEmail}" readonly>
                        </th:block>
                        <th:block th:if="${session.loginEmployer != null}">
                            <input type="email" id="email" name="email"
                            placeholder="답변 받으실 이메일을 입력해주세요" th:value="${session.loginEmployer.memberEmail}" readonly>
                        </th:block>
                    </div>

                    <div class="form-group">
                        <label >첨부파일</label>
                        <label for="file" class="file-input">파일 선택</label>
                        <input type="file" id="file" name="images"  onchange="handleFileSelect(this)" style="display: none;">
                        <p class="file-notice">* 파일은 최대 3개까지 첨부 가능합니다. (각 파일 최대 5MB)</p>
                        <div class="file-error">최대 3개의 파일만 첨부할 수 있습니다.</div>
                        <div class="file-list" id="fileList"></div>
                    </div>

                    <button class="submit" type="submit">문의하기</button>
                </form>
            </div>


            <div id="listTab" class="inquiry-list">
                <div>
                </div>

                <div class="pagination">
                </div>
            </div>
    </main>

    <!-- footer 우선 갖다가 쓰는겁니다 잊지말고 바꿔야해요 -->
    <th:block th:replace="~{common/main-footer}"></th:block>
    <script src="/js/serviceCenter/inquiry.js"></script>
</body>

</html>
