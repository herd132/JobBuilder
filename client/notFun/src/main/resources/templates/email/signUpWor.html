<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- 메일은 header 불필요 -->

<body>
  <div
    style="font-family: sans-serif; margin: 0; padding: 2rem 0 2rem 0; display: flex; justify-content: center; align-items: center; height: 100%; background-color: #f0f0f0;">

    <!-- 흰색배경영역(안쪽) -->
    <div
      style="width: 45%; height: 100%; padding: 2rem 2rem 0 2rem; background-color: white; box-shadow: 0 0 20px rgba(0, 0, 0, 0.1); text-align: left; margin: 0;">

      <div
        style="padding: 1.5rem; border-radius: 10px; border: #333; border-style: double; border-width: 2px; margin: 0.5rem; margin-bottom: 2rem;">
        <!-- 상단 제목 스타일 -->

        <fieldset>
          <legend align="center" style="padding-left: 1rem; padding-right: 1rem;">
            <h1 style="text-align: center; margin-bottom: 2rem;">이메일 인증</h1>
          </legend>

          <!-- 이메일 입력 영역 -->

          <div style="display: block; justify-content: center; margin-bottom: 2rem; padding-bottom: 0.7rem;">

            <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 1rem;">
              <div
                style="background-color: #333; width: 17rem; height: 17rem; border-radius: 10%; display: flex; justify-content: center; align-items: center; padding: 10px; border: 0.1rem solid white;">
                <img src="cid:logo" style="width:100%; height: 100%; border-radius: 10%; object-fit: cover;">
              </div>
            </div>
          </div>

          <div style="display: flex; justify-content: center; padding-left: 20px;"> <!-- 항목 영역 -->
            <div style="display: block; justify-content: center;">
              <h3 style="display: flex; justify-content: left; margin: 0.5rem;">아래 발급된 인증 번호를 제한 시간 내에<br>입력 후 인증 버튼을
                눌러주세요.</h3>
              <h3 style="text-align: center; border: 3px solid black; color: blue; 
                    width: 400px; padding: 10px;">
                <th:block th:text="${authKey}"></th:block>
              </h3>
            </div>
          </div>
      </div>
      </fieldset>
    </div> <!-- 배경선 -->
  </div> <!-- 흰색부분 -->
  </div> <!-- 회색부분 -->
</body>

</html>
